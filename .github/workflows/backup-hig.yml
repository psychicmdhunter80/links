name: Backup live HIG page

on:
  push:
    paths:
      - '.github/workflows/backup-hig.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch current live page
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'HIG-GitHub-Backup/1.0' \
            'https://hig.tinythor.cc/' \
            --output index.html
          test -s index.html
          grep -q "Hunter's Intuitive Guidance" index.html

      - name: Record backup metadata
        run: |
          {
            echo "source=https://hig.tinythor.cc/"
            echo "fetched_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "sha256=$(sha256sum index.html | awk '{print $1}')"
            echo "bytes=$(wc -c < index.html | tr -d ' ')"
          } > BACKUP-METADATA.txt

      - name: Commit live backup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html BACKUP-METADATA.txt
          if git diff --cached --quiet; then
            echo 'Live backup already matches the repository.'
            exit 0
          fi
          git commit -m 'Backup live hig.tinythor.cc [skip ci]'
          git push
