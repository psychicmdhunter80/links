name: Deploy HIG link page

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy-hig.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hig-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_DEPLOY_TOKEN is missing'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }

      - name: Verify HIG source
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q "Hunter's Intuitive Guidance" index.html

      - name: Validate deployment bundle
        run: npx --yes wrangler@latest deploy --dry-run

      - name: Deploy to Cloudflare
        run: npx --yes wrangler@latest deploy

      - name: Smoke test live page
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error \
              --max-time 20 \
              --user-agent 'HIG-GitHub-Deploy/1.0' \
              'https://hig.tinythor.cc/' \
              | grep -q "Hunter's Intuitive Guidance"; then
              echo 'Live HIG page is responding correctly.'
              exit 0
            fi
            echo "Smoke test attempt ${attempt}/12 not ready yet; retrying in 5 seconds..."
            sleep 5
          done
          echo 'Live HIG smoke test did not pass in time.'
          exit 1
